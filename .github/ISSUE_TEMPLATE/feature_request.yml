name: Feature request
description: Something replicos should be able to do and cannot
labels: [ enhancement ]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem, not the solution. The shape of the data and how many nodes usually decide the answer.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What replicos makes you do today
      description: Including the workaround you are using, if there is one.

  - type: textarea
    id: hotpath
    attributes:
      label: Is this on the write path
      description: >
        Replicos will not put work in an append or on the IO thread for a feature that only some applications need.
        If this belongs there, say what it would cost and why it is worth it.
